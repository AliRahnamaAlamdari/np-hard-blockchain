# Smoke-test configuration: exercises the entire pipeline on toy sizes.
#
# Everything here is deliberately tiny so `scripts/smoke_test.sh` finishes in a
# couple of minutes. Numbers produced under this config are NOT paper results --
# they only prove the code paths run end to end.

base: default.yaml

name: smoke
description: Fast end-to-end check on toy parameters

pow:
  difficulty_bits: 8
  max_attempts: 1000000

repository:
  num_instances: 8
  instance_size: 6

network:
  num_miners: 3
  num_blocks: 4

run:
  seeds: [0, 1]
  output_dir: results/smoke
  log_level: INFO
  log_every_blocks: 2
  repetitions: 2

sweep:
  difficulty_tiers:
    - {label: Low, difficulty_bits: 6}
    - {label: Medium, difficulty_bits: 9}
    - {label: High, difficulty_bits: 12}
  blocks_per_tier: 3
  instance_sizes: [4, 6]
  compare_held_karp: true
  vrf_backends: [ecvrf, ecdsa_pseudo, hash_stub]
  blocks: 3
  asymmetry_sizes: [5, 6]
  asymmetry_blocks: 2
  attempt_budgets: [1, 2, 5, 10]
  repository_sizes: [4, 16, 64]
  draws_per_size: 200
  hash_rate_distributions:
    - {label: equal, rates: [1, 1, 1]}
    - {label: skewed, rates: [1, 1, 4]}
  check_optimality: true
  spam_seconds: 0.2
  scan_instances: 8
  repetitions: 2
