# Regenerates the paper's Table 6 (tab:validationcost).
#
# Profiles all three VRF backends, because the paper's reported 0.001958 ms for
# "VRF Proof Verification" is roughly three orders of magnitude faster than any
# elliptic-curve verification in CPython (PAPER_SPEC.md 11-I6).

base: ../default.yaml

name: table6_validation_cost
description: Per-step validation latency and the solve-versus-verify asymmetry

pow:
  difficulty_bits: 10

repository:
  instance_size: 10

network:
  num_miners: 5
  num_blocks: 20

run:
  seeds: [0, 1, 2]
  log_every_blocks: 10

sweep:
  vrf_backends: [ecvrf, ecdsa_pseudo, hash_stub]
  blocks: 20
  # Verification cost is essentially flat in N while solving grows as (N-1)!, so the
  # solve/verify ratio is a property of the instance size, not of the protocol.
  # Sweeping it makes that explicit instead of reporting one number as a constant.
  asymmetry_sizes: [8, 9, 10, 11]
  asymmetry_blocks: 3
  # Per-solver asymmetry sweep. The exhaustive solver caps out at N=12, the exact
  # dynamic program reaches N=20, and the heuristic reaches several hundred, so
  # the solve-versus-verify ratio has to be stated per backend rather than once.
  # Block counts are reduced on the cells that would otherwise dominate the run.
  asymmetry_sweeps:
    - solver: brute_force
      sizes: [8, 9, 10, 11, 12]
      blocks: 3
      blocks_by_size: {12: 1}
    - solver: held_karp
      sizes: [10, 14, 16, 18, 20]
      blocks: 3
      blocks_by_size: {20: 1}
    - solver: nearest_neighbor_2opt
      sizes: [20, 100, 400, 800]
      blocks: 3
